# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown is docs
# wherever it lives, with one named exception: sway_test.sh:314 asserts that
# config/sway/README.md's own content contains the word "dim" (a
# presence/parse check on the file itself, not just its existence — see that
# test's header comment), so a markdown-only edit to that specific file can
# change what the test suite requires. Everything else is code, including
# .gitignore (ignore rules can hide files from CI's own staging steps).
code config/sway/README.md
docs **/*.md

# The subject prefixes a commit on this lane must carry, so nothing here can
# ever read like a bare behavior-change subject. Only the two housekeeping
# prefixes a markdown-only diff can actually earn: docs: and a todo:-only
# TODO.md edit.
prefixes docs todo

# No workflow here declares workflow_dispatch, so no dispatched run is
# legitimate: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
