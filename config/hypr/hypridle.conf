# hypridle configuration
# ~/.config/hypr/hypridle.conf
#
# Laptop-friendly idle behavior: dim the screen first, then lock, then turn
# the display off, then suspend. Timeouts are cumulative from the last input.

# The timeouts, in seconds: tide's settings (its SPEC.md §10, §16) write
# them to tide-idle.conf beside this file, which overrides these. Without
# it (before tide has run, or without tide), hypridle logs the missing
# file and keeps these. `source` needs hypridle 0.1.7.
$tide_idle_dim = 150
$tide_idle_lock = 300
$tide_idle_displays_off = 330
$tide_idle_suspend = 1800
source = tide-idle.conf

# The tide session (XDG_CURRENT_DESKTOP holds "tide") locks with tide-lock
# (tide SPEC.md §10); a plain Hyprland login keeps hyprlock. hypridle runs
# each command with /bin/sh -c.

general {
    # Lock on logind's Lock signal, never stacking two locks: starting
    # tide-lock.service while it runs does nothing, and pgrep guards hyprlock.
    # Only this user's hyprlock counts: another user's locks only theirs.
    # A tide-lock that can't run falls back to hyprlock through the unit's
    # OnFailure=, but a unit that isn't there (tide's `make install` not run
    # since it was added) or is masked never fails, so the session would stay
    # unlocked: then hyprlock locks here, and a notification says so, as the
    # unit's fallback does.
    lock_cmd = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) state=$(systemctl --user show -p LoadState --value tide-lock.service 2>&1); if test "$state" = loaded; then systemctl --user start tide-lock.service; else echo "hypridle lock_cmd: tide-lock.service is ${state:-not known}, so hyprlock locks instead" >&2; pgrep -u "$(id -u)" -x hyprlock >/dev/null || { hyprlock & notify-send --urgency=critical --app-name=tide "The tide lock failed" "hyprlock locked the session instead. Run tide doctor to see why."; wait; }; fi ;; *) pgrep -u "$(id -u)" -x hyprlock >/dev/null || hyprlock ;; esac
    # Lock before the system sleeps so you wake to a lock screen.
    before_sleep_cmd = loginctl lock-session
    # Fix DPMS state when resuming. In tide, `tide displays on` turns them
    # on in either of its sessions, Hyprland's or tidewm's.
    after_sleep_cmd = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide displays on ;; *) hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ;; esac
}

# 2.5 min by default: dim the backlight (save & restore the previous
# brightness).
listener {
    timeout = $tide_idle_dim
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min by default: lock the session. In tide, `tide idle-lock` locks
# through logind too, first marking the lock as idle so it opens on the
# screensaver face.
listener {
    timeout = $tide_idle_lock
    on-timeout = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide idle-lock ;; *) loginctl lock-session ;; esac
}

# 5.5 min by default: turn the display off (DPMS), on again on activity.
# In tide, `tide displays` does it in either of its sessions: Hyprland's
# dpms dispatcher, or tidewm's output power (tide SPEC.md §10).
listener {
    timeout = $tide_idle_displays_off
    on-timeout = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide displays off ;; *) hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' ;; esac
    on-resume = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide displays on ;; *) hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' ;; esac
}

# 30 min by default: suspend the machine. In tide, `tide idle-suspend`
# suspends only on battery; on AC it notes the skipped suspend, so unplugging
# later still suspends, and any input after it forgets it (tide SPEC.md §10).
listener {
    timeout = $tide_idle_suspend
    on-timeout = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide idle-suspend ;; *) systemctl suspend ;; esac
    on-resume = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide idle-suspend --cancel ;; esac
}
