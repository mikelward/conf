# hypridle configuration
# ~/.config/hypr/hypridle.conf
#
# Laptop-friendly idle behaviour: dim the screen first, then lock, then turn
# the display off, then suspend. Timeouts are cumulative from the last input.

# The tide session (XDG_CURRENT_DESKTOP holds "tide") locks with tide-lock
# (tide SPEC.md §10); a plain Hyprland login keeps hyprlock. hypridle runs
# each command with /bin/sh -c.

general {
    # Lock on logind's Lock signal, never stacking two locks: starting
    # tide-lock.service while it runs does nothing, and pidof guards hyprlock.
    lock_cmd = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) systemctl --user start tide-lock.service ;; *) pidof hyprlock || hyprlock ;; esac
    # Lock before the system sleeps so you wake to a lock screen.
    before_sleep_cmd = loginctl lock-session
    # Fix DPMS state when resuming.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2.5 min: dim the backlight (save & restore the previous brightness).
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock the session. In tide, `tide idle-lock` locks through logind
# too, first marking the lock as idle so it opens on the screensaver face.
listener {
    timeout = 300
    on-timeout = case ":$XDG_CURRENT_DESKTOP:" in *:tide:*) tide idle-lock ;; *) loginctl lock-session ;; esac
}

# 5.5 min: turn the display off (DPMS), on again on activity.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend the machine.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
