# xdg-desktop-portal-hyprland, read as it starts: restart it
# (`systemctl --user restart xdg-desktop-portal-hyprland`) to apply a change.

# When an app asks to share the screen, ask tide's picker what to share
# (tide SPEC.md §12), or xdph's own where tide isn't installed. A script
# rather than a name, since xdph runs the name it's given and fails the
# share if that's missing; hyprlang fills in $HOME.
screencopy {
    custom_picker_binary = $HOME/.config/hypr/scripts/share-picker.sh
}
