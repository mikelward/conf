# macOS only: kitty.conf includes this as ${KITTY_OS}.conf (kitty 0.27.0+).

# tide for macOS opens a new kitty window through remote control, so the shell in
# it gets TIDE_WORKSPACE (tidemo SPEC.md §6.3). socket-only: only the
# socket below is obeyed, never a program writing escape codes to a
# terminal, which is how anything printed in a window, over ssh included,
# could otherwise drive kitty.
allow_remote_control socket-only

# A relative path lands in kitty's temporary folder, the per-user, mode-700
# $TMPDIR, as kitty-<pid>; /tmp would be shared with every user. tide for macOS
# checks the socket and its folder are yours before it connects.
listen_on unix:kitty

# A bell marks its window for attention in tide for macOS, as it does on tide
# (tidemo SPEC.md §14.2): kitty's own alert only bounces the Dock icon.
# tide-bell asks the socket above which window rang.
command_on_bell ~/.config/kitty/tide-bell

# A 1x Mac display draws a point as one pixel, so 11 pt (kitty.conf) is
# smaller here than on Linux; 14 is about the same size.
font_size 14.0

# legacy (kitty.conf) thickens text, which blurs bold on a non-Retina
# display. kitty's macOS default (platform, 1.7 30) thickens on top of
# macOS's own smoothing (setup-macos sets light). Gamma 1.5 gives dark text
# on light enough weight; contrast 10 suits light text on dark.
text_composition_strategy 1.5 10

# macOS rounds every window's corners, 16 pt from macOS 26 (tidemo SPEC.md
# §2.1), which cuts into text set right against the edge, as kitty.conf's
# 0 sets it. A 5 pt inset clears the curve: a corner of radius r reaches
# r(1 - 1/sqrt 2), 4.7 pt, along the diagonal.
window_padding_width 5

# macOS has no primary selection, so there kitty's paste_from_selection
# pastes the clipboard. Selecting copies to a buffer of kitty's own instead,
# and the middle button and the selection keys (kitty.conf) paste it, as
# they paste the primary selection on Linux. The clipboard is left alone.
# The buffer is kitty's: it reaches every kitty window, and no other app.
copy_on_select a1
mouse_map middle release ungrabbed paste_from_buffer a1
mouse_map shift+middle release ungrabbed,grabbed paste_from_buffer a1
map ctrl+shift+s paste_from_buffer a1
map shift+insert paste_from_buffer a1
