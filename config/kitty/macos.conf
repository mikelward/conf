# macOS only: kitty.conf includes this as ${KITTY_OS}.conf (kitty 0.27.0+).

# tilemo opens a new kitty window through remote control, so the shell in
# it gets TIDE_WORKSPACE (tilemo SPEC.md §6.3). socket-only: only the
# socket below is obeyed, never a program writing escape codes to a
# terminal, which is how anything printed in a window, over ssh included,
# could otherwise drive kitty.
allow_remote_control socket-only

# A relative path lands in kitty's temporary folder, the per-user, mode-700
# $TMPDIR, as kitty-<pid>; /tmp would be shared with every user. tilemo
# checks the socket and its folder are yours before it connects.
listen_on unix:kitty
