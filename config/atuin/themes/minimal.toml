# Minimal atuin theme: strip the noise, keep the selection legible.
#
# atuin styles the *selected* result row -- the one Enter runs -- with the
# AlertError color, which is red. That is semantically wrong (the selected
# row is not an error), and it's a known, still-open atuin issue:
#   https://github.com/atuinsh/atuin/issues/2663
# atuin also forces bold on the selected row in code, independent of the
# theme, so overriding AlertError to the terminal default leaves the
# selection *bold, not red* -- which is all the highlight we want.
[theme]
name = "minimal"

[colors]
# @reset = the terminal's default foreground. If atuin's parser rejects it,
# use an explicit color (a palette name, a #hex, or @<crossterm-name>).
AlertError = "@reset"
