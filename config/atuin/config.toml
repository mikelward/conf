# In zsh, Up opens atuin's prefix search and Down (like Ctrl-R) opens its
# fuzzy search -- both the same pane, reached with an arrow (bound in shrc).
# Whatever's on the line seeds the search as its initial query. The two
# settings below shape the prefix search that Up opens (for zsh's Up, and for
# fish's and nushell's Up, which use atuin's own up-search):
#
#   prefix  match on what's already typed, from the start of the line,
#           rather than fuzzy-matching it anywhere in the command
#   host    this machine's history; with no cross-host sync that's all of it
#
# Down and Ctrl-R use atuin's default search_mode (fuzzy) + filter_mode
# (global). The zsh ghost text stays prefix + host regardless (set_zsh_
# autosuggest_strategy in shrc): an inline completion can only extend what
# you typed.
search_mode_shell_up_key_binding = "prefix"
filter_mode_shell_up_key_binding = "host"

# Draw the search in a few lines above the prompt instead of switching to
# the alternate screen. The default (inline_height = 0) is full-screen,
# which clears the terminal on a keystroke pressed dozens of times an
# hour: the scrollback the search was meant to help you avoid re-typing
# is exactly what disappears while you search it.
#
# Keep it minimal -- a short list, nothing else. compact drops the framing;
# inline_height 6 shows ~5 entries with no blank padding; the preview line,
# help line, and the Search/Inspect tab bar are all off (Inspect is still on
# its Ctrl-O key, just not shown). The only chrome left is the one-line
# filter/search indicator. Tune inline_height to taste (5-7).
inline_height = 6
style = "compact"
show_preview = false
show_help = false
show_tabs = false

# List results top-to-bottom below the search line. atuin's default puts the
# search input at the bottom with matches stacking upward (newest nearest the
# input), which reads bottom-to-top; invert flips it so the input sits at the
# top of the pane and matches run downward beneath it.
invert = true

# Run the selected command on Enter, rather than only pasting it onto the
# prompt. Tab still pastes it for editing first. New atuin installs default to
# this, but an upgraded install keeps the old paste-only Enter, so set it
# explicitly.
enter_accept = true

# Show only the command in each result row -- drop the duration, age/time,
# exit, directory and other columns atuin draws by default. Just the command.
[ui]
columns = ["command"]

# Use atuin's built-in "(none)" theme: it forces every semantic color to the
# terminal default, so results are plain -- no green command, no red selected
# row. The selected row still stands out because atuin forces bold on it in
# code, independent of the theme. A custom theme can't express "terminal
# default": atuin's color parser takes only named colors and #hex, with no
# reset/default token, so "plain" would mean hardcoding a foreground that
# breaks on the other background. The red-selection default is semantically
# wrong and still open upstream: atuinsh/atuin#2663.
[theme]
name = "(none)"

# Disable atuin's opt-in AI assistant. It generates/explains commands by
# sending the query to an external LLM (needs an account/key, so unconfigured
# it just prints "Atuin AI is not yet configured"). Off explicitly: it's a
# third-party network call on the shell's hot path -- latency, cost, and the
# command text leaving the box -- and it isn't wanted here. This file is
# atuin's config (symlinked to ~/.config/atuin/config.toml); flip to true here
# to re-enable -- atuin reads no separate local-override file.
[ai]
enabled = false
