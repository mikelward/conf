# Up opens atuin's search rather than the shell's own prefix search (see
# init_atuin in shrc and the equivalents in the fish and nushell configs),
# so the two settings below make it behave the way Up did before:
#
#   prefix  match on what's already typed, from the start of the line,
#           rather than fuzzy-matching it anywhere in the command
#   host    every session on this machine -- global would offer commands
#           from other hosts, which may not have them installed
#
# Ctrl-R keeps the defaults, which is where the fuzzy, everywhere-search
# belongs.
search_mode_shell_up_key_binding = "prefix"
filter_mode_shell_up_key_binding = "host"

# Draw the search in a few lines above the prompt instead of switching to
# the alternate screen. The default (inline_height = 0) is full-screen,
# which clears the terminal on a keystroke pressed dozens of times an
# hour: the scrollback the search was meant to help you avoid re-typing
# is exactly what disappears while you search it. compact drops the
# framing that only earns its space at full height, and the preview,
# help and tab lines go with it -- at nine rows they're most of the pane.
# The tab bar lists one tab until the inspector is opened, so its row is
# spent on nothing.
inline_height = 9
style = "compact"
show_preview = false
show_help = false
show_tabs = false
