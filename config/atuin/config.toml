# zsh binds Up to a native prefix history search now (init_atuin passes
# --disable-up-arrow; up-line-or-local-history in shrc), so atuin's Up pane
# is gone there. fish and nushell still open atuin's Up search, and the two
# settings below shape it to match what Up has always meant here, until they
# move to native Up too (see TODO.md):
#
#   prefix  match on what's already typed, from the start of the line,
#           rather than fuzzy-matching it anywhere in the command
#   host    every session on this machine -- global would offer commands
#           from other hosts, which may not have them installed
#
# Ctrl-R keeps the defaults everywhere, where the fuzzy, everywhere-search
# belongs.
search_mode_shell_up_key_binding = "prefix"
filter_mode_shell_up_key_binding = "host"

# Draw the search in a few lines above the prompt instead of switching to
# the alternate screen. The default (inline_height = 0) is full-screen,
# which clears the terminal on a keystroke pressed dozens of times an
# hour: the scrollback the search was meant to help you avoid re-typing
# is exactly what disappears while you search it.
#
# Keep it minimal -- a short list, nothing else. compact drops the framing;
# inline_height 6 shows ~5 entries with no blank padding; the preview line,
# help line, and the Search/Inspect tab bar are all off (Inspect is still on
# its Ctrl-O key, just not shown). The only chrome left is the one-line
# filter/search indicator. Tune inline_height to taste (5-7).
inline_height = 6
style = "compact"
show_preview = false
show_help = false
show_tabs = false

# Show only the command in each result row -- drop the duration, age/time,
# exit, directory and other columns atuin draws by default. Just the command.
[ui]
columns = ["command"]

# Use atuin's built-in "(none)" theme: it forces every semantic color to the
# terminal default, so results are plain -- no green command, no red selected
# row. The selected row still stands out because atuin forces bold on it in
# code, independent of the theme. A custom theme can't express "terminal
# default": atuin's color parser takes only named colors and #hex, with no
# reset/default token, so "plain" would mean hardcoding a foreground that
# breaks on the other background. The red-selection default is semantically
# wrong and still open upstream: atuinsh/atuin#2663.
[theme]
name = "(none)"
