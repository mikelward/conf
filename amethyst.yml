# Amethyst tiling window manager configuration
# Keybindings match KDE/Krohnkite setup with alt (option) as modifier
#
# The scripts repo's MACOS.md has the full key mapping against the
# KDE/Krohnkite side, the manual steps setup-macos can't do, and why Amethyst
# rather than yabai or AeroSpace.

mod1:
  - option

mod2:
  - option
  - control

layouts:
  - tall
  - 3column-left
  - column
  - wide
  - fullscreen

# Both pointer/focus links stay off.
#
# focus-follows-mouse dismisses popovers: Amethyst hit-tests only the windows
# it tracks, so an untracked overlay is invisible to it and it focuses whatever
# sits underneath, deactivating the overlay's app (ianyh/Amethyst#277).
# setup-macos writes the same value to the preference domain, for machines
# without this file; setting it here too means a fresh launch can't pick up a
# stale true from the Preferences checkbox.
#
# mouse-follows-focus warps the pointer to each newly focused window, which is
# unwanted on its own terms.
focus-follows-mouse: false
mouse-follows-focus: false
follow-space-thrown-windows: true
new-windows-to-main: false
window-margins: true
window-margin-size: 5

# Keybindings matching Krohnkite
# Resize (Krohnkite: Meta+\ and Meta+/)
expand-main:
  mod: mod1
  key: backslash

shrink-main:
  mod: mod1
  key: slash

# Layouts (Krohnkite: Meta+` for monocle, Meta+,/. for cycle)
select-fullscreen-layout:
  mod: mod1
  key: grave

cycle-layout-backward:
  mod: mod1
  key: comma

cycle-layout:
  mod: mod1
  key: period

# Set master (Krohnkite: Meta+Return)
swap-main:
  mod: mod1
  key: return

# Throw window to space (Krohnkite: Meta+Shift+1-9)
throw-space-1:
  mod: mod2
  key: "1"

throw-space-2:
  mod: mod2
  key: "2"

throw-space-3:
  mod: mod2
  key: "3"

throw-space-4:
  mod: mod2
  key: "4"

throw-space-5:
  mod: mod2
  key: "5"

throw-space-6:
  mod: mod2
  key: "6"

throw-space-7:
  mod: mod2
  key: "7"

throw-space-8:
  mod: mod2
  key: "8"

throw-space-9:
  mod: mod2
  key: "9"
